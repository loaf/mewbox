<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>09 空态 / 启动 · MewBox</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="cream">

<div class="splash-grid">
  <!-- 启动页 -->
  <div class="phone splash">
    <div class="sp-brand">MewBox</div>
    <div class="sp-slogan">每一个想法，<br>都值得被写下。</div>
    <div class="sp-cat">
      <div class="box"><div class="cat"><i class="ear l"></i><i class="ear r"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="paw"></i><i class="pen"></i></div></div>
      <div class="cup">🐾</div>
    </div>
    <div class="sp-bar"><i style="width:64%"></i></div>
    <div class="sp-load">正在启动 MewBox…</div>
  </div>

  <!-- 空态页 -->
  <div class="phone empty">
    <div class="tb-mini"><span>—</span><span>▢</span><span>✕</span></div>
    <div class="em-think">💭<span class="doc-ic">📄</span></div>
    <div class="em-cat"><div class="box sm"><div class="cat"><i class="ear l"></i><i class="ear r"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i></div></div></div>
    <div class="em-title">还没有草稿</div>
    <div class="em-sub">开始写下你的想法吧，<br>你的每一个灵感都在这里。</div>
    <button class="btn-primary lg">＋ 新建草稿</button>
  </div>
</div>

<a class="proto-home" href="index.html">← 所有界面</a>
</body>
</html>
