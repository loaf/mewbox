[package]
name = "mewbox"
version = "0.1.0"
description = "喵盒 MewBox — 本地优先的个人写作工作台"
authors = ["lijun"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# make the lib name unique and won't conflict with the bin name.
# This seems to only be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mewbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
# jieba-rs 必须保留默认特性 default-dict（内嵌词典）：
# default-features = false 会得到空词典实例，中文分词全部失效
jieba-rs = "0.7"
walkdir = "2"
pathdiff = "0.2"
fs2 = "0.4"
thiserror = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
